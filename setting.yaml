# Binance ZAI Trader runtime config

# Trading loop
cycle_interval_seconds: 60

# Prompt input: 168 recent 1h close prices, with the newest value aligned
# to the live reference price.
ai_prompt_timeframe: 1h
ai_prompt_candle_count: 168

# ZAI GLM-5.2 with thinking enabled and max reasoning effort.
zai_model: glm-5.2
zai_reasoning_effort: max
zai_max_tokens: 8192
zai_timeout_seconds: 300.0

# Portfolio allocation
# Four active slots each target 1/4 margin allocation. Active 1/2/3 screen
# TradFi USDT-M perpetuals; active 4 screens the full USDT-M perpetual
# universe, including TradFi and non-TradFi crypto symbols.
active_leverage: 1
capital_usage_ratio: 0.99
rebalance_threshold_pct: 0.02
stop_loss_pct: 0.05
active_rescreen_interval_hours: 18

# Active candidates are ranked by one-week trend quality over
# ai_prompt_candle_count closes on ai_prompt_timeframe. The trend screener
# records LONG or SHORT from the fitted log-price slope, scores direction
# consistency with R-squared, efficiency, adverse excursion, and daily
# consistency, and skips flat or inconsistent endpoint paths. Weekly
# consistency is retained as diagnostic metadata, but excluded from the
# default score because the default one-week window has only one weekly segment.
#
# Before ranking, the screener applies a directional 24-candle entry filter
# against the live lookup price:
# - LONG: min(low over latest 24 1h klines) >= live_price * 0.95
# - SHORT: max(high over latest 24 1h klines) <= live_price * 1.05
#
# Once an active position is open, it is held until the fixed 5% stop loss,
# external/manual position cleanup, or the 18h review re-ranks candidates
# while allowing the current symbol.

# Binance public API stability knobs for active screening.
screener_quote: USDT
screener_timeout: 30.0
screener_retries: 3
screener_request_sleep: 0.10
