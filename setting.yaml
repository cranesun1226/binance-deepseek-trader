# Binance DeepSeek Trader runtime config

# Trading loop
cycle_interval_seconds: 60

# LLM trigger: re-evaluate a slot when price moves +/- this percent
# from that slot's last LLM decision anchor.
trigger_pct_usdt: 1.0

# Prompt input: 672 recent 1h close prices, with the newest value aligned
# to the live reference price.
ai_prompt_timeframe: 1h
ai_prompt_candle_count: 672

# DeepSeek V4 Flash via https://api.deepseek.com/chat/completions
deepseek_model: deepseek-v4-flash
deepseek_reasoning_effort: max
deepseek_max_tokens: 8192
deepseek_timeout_seconds: 300.0

# Portfolio allocation
fixed_leverage: 1
capital_usage_ratio: 0.99
rebalance_threshold_pct: 0.03
stop_loss_pct: 0.04

# Passive slots are evaluated in this exact priority order.
passive_symbols:
  - CLUSDT
  - XAUUSDT
  - QQQUSDT
  - BTCUSDT

# active1 uses crypto USDT perpetuals near 4%.
# active2 uses TradFi USDT perpetuals with abs(24h change %) between 3% and 5%,
# ranked by closeness to 4%, then selected by highest quote volume from the pool.
# Active candidates must also have at least ai_prompt_candle_count candles on ai_prompt_timeframe.
active_targets:
  - 4.0
  - 4.0
active_candidate_pool_size: 10
active1_min_abs_change_pct: 3.0
active1_max_abs_change_pct: 5.0
active2_tradfi_min_abs_change_pct: 3.0
active2_tradfi_max_abs_change_pct: 5.0

# Binance public API stability knobs for active screening.
screener_quote: USDT
screener_timeout: 30.0
screener_retries: 3
screener_request_sleep: 0.10
