# Binance DeepSeek Trader runtime config

# Trading loop
cycle_interval_seconds: 60

# Passive decision trigger: re-evaluate passive slots when price moves +/-
# this percent from that slot's last decision anchor. Active slots ignore this
# price trigger while a position is open.
trigger_pct_usdt: 1.0

# Prompt input: 168 recent 1h close prices, with the newest value aligned
# to the live reference price.
ai_prompt_timeframe: 1h
ai_prompt_candle_count: 168

# DeepSeek V4 Flash via https://api.deepseek.com/chat/completions
deepseek_model: deepseek-v4-flash
deepseek_reasoning_effort: max
deepseek_max_tokens: 8192
deepseek_timeout_seconds: 300.0

# Portfolio allocation
# All 8 slots target 1/8 margin allocation. Passive fixed-symbol slots use
# 2x leverage; all active slots also use 2x leverage.
passive_leverage: 2
active_leverage: 2
capital_usage_ratio: 0.99
rebalance_threshold_pct: 0.03
stop_loss_pct: 0.04
active_rescreen_interval_hours: 24

# Passive slots are evaluated in this exact priority order.
passive_symbols:
  - CLUSDT
  - XAUUSDT
  - QQQUSDT
  - BTCUSDT

# active1 screens crypto USDT perpetuals.
# active2, active3, and active4 screen TradFi USDT perpetuals.
# Active candidates are ranked by close_range_volatility:
# abs(last_close-first_close)/((last_close+first_close)/2), using
# ai_prompt_candle_count closes on ai_prompt_timeframe.
# Active direction is LONG when last_close > first_close and SHORT when
# last_close < first_close. Flat candidates are skipped.
# When a slot needs a new active symbol, it excludes current and immediately
# previous symbols from the same active universe: active1 for crypto,
# active2/active3/active4 for TradFi.
# Once an active position is open, it is held until the fixed 4% stop loss,
# external/manual position cleanup, or the 24h rank review finds another top
# symbol in the same active universe. Active slots do not use the 1% decision
# trigger while holding a position.
# Before ranking, the latest returned 2 klines are filtered by high/low range
# change <= 4%; this intentionally includes the currently forming 1h candle
# and the immediately preceding candle, not only fully closed candles.

# Binance public API stability knobs for active screening.
screener_quote: USDT
screener_timeout: 30.0
screener_retries: 3
screener_request_sleep: 0.10
